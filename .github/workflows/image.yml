name: Image

# Builds the site image, runs the end-to-end test (test/e2e.sh) and, on main, publishes it.
#
# There is no scheduled rebuild: the image changes when the repository changes. (Base-image
# security fixes are picked up by the next push or a manual run of this workflow.)
#
# Pull requests: build for amd64, run the test, publish nothing (read-only token).
# Main: the image that is tested is the image that is published. It is built once for
# amd64 and arm64 and pushed by digest only (no tag yet); the test pulls the amd64 variant of
# exactly that digest; only if it passes are the tags 3.2, latest and sha-<short> put on that same
# digest, which is then signed and attested. The arm64 variant is built but not run in CI.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer run replaces an older one on pull requests; on main a publish is never cancelled.
concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/kazuhahub/wifi-proxy

jobs:
  pr-test:
    name: build and end-to-end test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install eapol_test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq eapoltest
      - name: Build (amd64, local)
        run: docker build --pull --build-arg REVISION="${GITHUB_SHA}" -t wifi-proxy:test .
      - name: End-to-end test
        run: bash test/e2e.sh wifi-proxy:test

  release:
    name: build, test and publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=3.2
            type=raw,value=latest
            type=sha,format=short

      # Pushed by digest only: it has no tag, so nothing pulls it by accident before the test passed.
      - name: Build once (amd64 + arm64) and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Install eapol_test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq eapoltest

      - name: End-to-end test of the amd64 variant of that build
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${IMAGE}@${DIGEST}"
          bash test/e2e.sh "${IMAGE}@${DIGEST}"

      # The test passed: give the very same digest its tags. Nothing is rebuilt or re-pushed.
      # Then check that the tags really resolve to the tested digest; if not, fail the job
      # before anything is signed or attested.
      - name: Tag the tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          for t in $TAGS; do
            got=$(docker buildx imagetools inspect "$t" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$t resolves to $got, not the tested digest $DIGEST"
              exit 1
            fi
          done

      # Signed and attested: the digest that was tested.
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
