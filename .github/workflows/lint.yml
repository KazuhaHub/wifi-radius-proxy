name: lint

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its stale run; each main push gets its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Lint the workflow files (and the shell inside their run: blocks); Go is preinstalled on ubuntu-latest.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # Lint every tracked file whose first line is a sh/bash shebang, so extension-less scripts are covered too.
      - name: shellcheck
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            if head -n 1 "$f" | grep -Eq '^#!.*(ba)?sh'; then printf '%s\0' "$f"; fi
          done | xargs -0 shellcheck -S warning
